name: Deploy Firebase Functions

on:
  push:
    branches:
      - main
    paths:
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/firebase-functions.yml"
  workflow_dispatch:

jobs:
  deploy_functions:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRESENSI_FASILITATOR }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install functions dependencies
        working-directory: functions
        run: npm install

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Functions
        run: firebase deploy --only functions --project presensi-fasilitator

      - name: Get adminUserAction logs
        run: firebase functions:log --only adminUserAction --project presensi-fasilitator
