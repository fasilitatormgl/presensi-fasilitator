name: Deploy Firebase Functions

on:
  push:
    branches:
      - main
    paths:
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/firebase-functions.yml"
  workflow_dispatch:

jobs:
  deploy_functions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRESENSI_FASILITATOR }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Node.js version
        run: |
          node --version
          npm --version

      - name: Install functions dependencies
        working-directory: functions
        run: npm install

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Check Firebase CLI
        run: firebase --version

      - name: Deploy Functions
        run: |
          firebase deploy \
            --only functions \
            --project presensi-fasilitator

      - name: Get adminUserAction logs
        if: always()
        run: |
          firebase functions:log \
            --only adminUserAction \
            --project presensi-fasilitator
